<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stránka nenalezena — Paralelní životy</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body{background:#F1EFE9;color:#16181D;font-family:system-ui,sans-serif;
       display:flex;min-height:100vh;align-items:center;justify-content:center;
       margin:0;padding:24px;text-align:center;line-height:1.6}
  .box{max-width:460px}
  .code{font-family:ui-monospace,monospace;font-size:13px;letter-spacing:.22em;
        text-transform:uppercase;color:#77736A;margin-bottom:14px}
  h1{font-size:clamp(28px,7vw,44px);text-transform:uppercase;letter-spacing:-.01em;margin:0 0 12px}
  p{color:#3A3D44;margin:0 0 22px}
  a{display:inline-block;border:1px solid #16181D;padding:10px 20px;
    text-decoration:none;color:#16181D;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  a:hover{background:#16181D;color:#F1EFE9}
  .bars{display:flex;gap:4px;justify-content:center;margin-bottom:26px}
  .bars i{width:22px;height:5px}
</style>
</head>
<body>
  <div class="box">
    <div class="bars">
      <i style="background:#B04A1E"></i><i style="background:#23566B"></i>
      <i style="background:#A3660F"></i><i style="background:#4A6328"></i>
      <i style="background:#5B3A6E"></i><i style="background:#7E2231"></i>
    </div>
    <div class="code">Chyba 404</div>
    <h1>Tady nic není</h1>
    <p>Tahle adresa na časové ose neexistuje. Zkuste to od začátku.</p>
    <a href="/">Zpět na osu</a>
  </div>
</body>
</html>
